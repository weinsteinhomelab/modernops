name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing. Aborting before SSH setup."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write the private key (works whether or not it has a passphrase)
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key

          # Trust the host
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Load the key into an ssh-agent. If SSH_PASSPHRASE is set, feed it
          # non-interactively via an askpass helper so an encrypted key works.
          eval "$(ssh-agent -s)"
          if [ -n "$SSH_PASSPHRASE" ]; then
            printf '#!/usr/bin/env bash\necho "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass.sh
            chmod +x ~/.ssh/askpass.sh
            DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force setsid -w ssh-add ~/.ssh/id_key
            rm -f ~/.ssh/askpass.sh
          else
            ssh-add ~/.ssh/id_key
          fi

          # Deploy via the agent (no -i needed; the agent holds the key)
          rsync -avz \
            -e "ssh -p $SSH_PORT" \
            --exclude='.git*' --exclude='.github' --exclude='hq' --exclude='*.md' \
            ./ "$SSH_USER@$SSH_HOST:~/www/modern-ops.net/public_html/"

          ssh-agent -k >/dev/null 2>&1 || true
