<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Modern Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #1a6b4a; --accent-light: #e8f4ee; --black: #1a1a1a; --mid: #555; --border: #ddd; --white: #fafaf8; }
  body { font-family: 'Lato', sans-serif; background: var(--white); color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }
  nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.25rem 6%; border-bottom: 1px solid var(--border); background: var(--white);
  }
  .logo { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.4rem; color: var(--black); text-decoration: none; }
  .logo span { color: var(--accent); }
  .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 6%; text-align: center; }
  .card { max-width: 520px; }
  .check { width: 72px; height: 72px; background: var(--accent-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; }
  .check svg { width: 36px; height: 36px; stroke: var(--accent); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: -0.02em; }
  p { color: var(--mid); font-size: 1.05rem; line-height: 1.75; margin-bottom: 2rem; }
  a { display: inline-block; background: var(--accent); color: white; padding: 0.8rem 1.75rem; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: opacity 0.2s; }
  a:hover { opacity: 0.85; }
  footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: #aaa; }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">Modern<span>Ops</span></a>
</nav>
<div class="main">
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Thanks for reaching out!</h1>
    <p>We've received your request and will be in touch within 24 hours. We're looking forward to helping your business grow.</p>
    <a href="/">Back to Modern Ops</a>
  </div>
</div>
<footer>© 2026 Modern Ops · modern-ops.net</footer>
</body>
</html>
